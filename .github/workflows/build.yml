name: Build

on:
  push:
  pull_request:

jobs:
  universal-macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify universal app
        run: make verify
      - name: Package
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGuard-universal
          path: dist/OpenGuard-1.0.0-universal.zip

